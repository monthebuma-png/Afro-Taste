
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfroTaste | Sign Up</title>
  <link rel="stylesheet" href="signup.css">
</head>

<body>

  <div class="signup-container">

    <div class="signup-box">

      <!-- Logo -->
      <div class="logo">
         <strong>AfroTaste</strong>
      </div>

      <h1>Join AfroTaste</h1>

      <p>
        Sign up to discover our latest African dishes,
        special offers and updates.
      </p>

      <!-- Sign Up Form -->
      <form id="signupForm">

        <input
          type="text"
          placeholder="Full Name"
          required
        >
<br>
        <input
          type="email"
          placeholder="Email Address"
          required
        >

        <br>
        <input
          type="tel"
          placeholder="Phone Number"
          required
        >

        <br>

        <button type="submit">
          Sign Up
        </button>

      </form>

      <p class="login-text">
        Already a member? <a href="index.html">Back to AfroTaste</a>
      </p>

    </div>

  </div>

  <script src="signup.js"></script>

  <section class="cta">
  <h2>Have questions?</h2>
  <p>Contact us and we'll be happy to help.</p>
  <a href="contact.html">Contact Us</a>
</section>

</body>
</html>
